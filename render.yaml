# Render に置くときの設定。
#
#   1. このリポジトリを GitHub に上げる
#   2. Render → New → Blueprint → このリポジトリを選ぶ
#   3. 環境変数（sync: false のもの）を画面で入れる
#
# 無料プランは使わないこと:
#   無料プランは一定時間で停止し、永続ディスクも付けられない。
#   停止すると台帳が消え、毎朝の同期も走らない。
 services:
  - type: web
    name: meishiaize
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /api/config
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SCAN_LIMIT_PER_DAY
        value: "10"
      - key: DATA_ROOT
        value: /data
      - key: OUTLOOK_DESKTOP
        value: "false"
      - key: CALENDAR_PROVIDER
        value: google

  - type: cron
    name: meishiaize-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    schedule: "0 0 * * *"
    dockerCommand: node main.js sync-all
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATA_ROOT
        value: /data
      - key: OUTLOOK_DESKTOP
        value: "false"
      - key: CALENDAR_PROVIDER
        value: google
