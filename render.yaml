services:
  - name: meishiaize
    type: web
    plan: starter
    runtime: docker
    region: singapore
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /

cronJobs:
  - name: meishiaize-sync
    plan: starter
    region: singapore
    schedule: "0 6 * * *"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
